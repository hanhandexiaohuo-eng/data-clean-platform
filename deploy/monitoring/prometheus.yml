# ============================================================
# Prometheus 采集示例（仅内网）
# ------------------------------------------------------------
# 1. backend 管理端口 8081 只在 Compose 内部网络可达；
# 2. Prometheus 需加入同一个 app_net，或通过内网跳板抓取；
# 3. 切勿把 /actuator 暴露到公网（Nginx 已固定返回 404）。
# ============================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dataclean-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  # 容器/进程健康探测：由 blackbox-exporter 从容器网络内部发起
  # （deploy/docker-compose.monitoring.yml 提供该服务）
  - job_name: dataclean-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx:8080/nginx-health
          - http://backend:8080/api/health
          - http://scanner:8080/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
