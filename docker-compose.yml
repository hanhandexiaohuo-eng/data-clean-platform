# ============================================================
# DataClean 生产运行基线
# ------------------------------------------------------------
# 端口边界：
#   - mysql：仅 db_net 内部网络，不映射宿主机端口；
#   - backend：加入 db_net + app_net，不映射宿主机端口；
#   - nginx：唯一对外入口，默认仅发布 HTTP 80（HTTPS 为后续阶段）。
#
# 数据持久化：
#   - mysql_data：数据库数据；
#   - backend_uploads / backend_logs：上传文件与日志。
#   容器重建不会丢失以上命名卷数据。
#
# 使用前：cp .env.example .env 并填写真实值（.env 不进入仓库/镜像）。
# ============================================================
name: dataclean

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dataclean}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - db_net
    # 仅容器内探测，不发布端口
    expose:
      - "3306"
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 可选：在后端启动前执行版本化迁移，成功后退出。
  # 使用同一应用数据库账号（需具备该库 DDL 权限）。
  migrate:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    image: dataclean-migrate:1
    restart: "no"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-dataclean}
      DB_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MIGRATION_LOCK_TIMEOUT: ${MIGRATION_LOCK_TIMEOUT:-60}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: dataclean-backend:1
    restart: unless-stopped
    # 仅注入后端所需变量，避免把 MySQL root 密码等无关凭据带进容器
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dataclean}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
      AI_SECRET_KEY: ${AI_SECRET_KEY:?请在 .env 中设置 AI_SECRET_KEY}
      AI_MAX_PROMPT_CHARS: ${AI_MAX_PROMPT_CHARS:-20000}
      AI_GOVERNANCE_ENABLED: ${AI_GOVERNANCE_ENABLED:-true}
      AI_AUDIT_PEPPER: ${AI_AUDIT_PEPPER:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_PATH: /app/uploads
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-100MB}
      UPLOAD_MAX_REQUEST_SIZE: ${UPLOAD_MAX_REQUEST_SIZE:-200MB}
      UPLOAD_MAX_ROWS: ${UPLOAD_MAX_ROWS:-500000}
      UPLOAD_MAX_COLUMNS: ${UPLOAD_MAX_COLUMNS:-1000}
      UPLOAD_MAX_EXCEL_SHEETS: ${UPLOAD_MAX_EXCEL_SHEETS:-20}
      UPLOAD_TEMP_TTL_MINUTES: ${UPLOAD_TEMP_TTL_MINUTES:-120}
      UPLOAD_TEMP_CLEAN_INTERVAL_MINUTES: ${UPLOAD_TEMP_CLEAN_INTERVAL_MINUTES:-60}
      UPLOAD_SCAN_PROVIDER: ${UPLOAD_SCAN_PROVIDER:-none}
      UPLOAD_SCAN_REQUIRED: ${UPLOAD_SCAN_REQUIRED:-true}
      UPLOAD_SCAN_URL: ${UPLOAD_SCAN_URL:-}
      UPLOAD_SCAN_TIMEOUT_MS: ${UPLOAD_SCAN_TIMEOUT_MS:-5000}
      UPLOAD_SCAN_MAX_RESPONSE_BYTES: ${UPLOAD_SCAN_MAX_RESPONSE_BYTES:-65536}
      UPLOAD_SCAN_TOKEN: ${UPLOAD_SCAN_TOKEN:-}
      # 仅受信代理网段可采信 X-Real-IP；默认与 app_net 固定网段一致，
      # 不得配置 0.0.0.0/0。若修改 app_net 子网，必须同步修改此值。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
      CLEAN_CUSTOM_FILTER_ENABLED: ${CLEAN_CUSTOM_FILTER_ENABLED:-false}
      # ---------- 公开演示模式（第三阶段） ----------
      APP_MODE: ${APP_MODE:-private}
      PUBLIC_ALLOWED_ORIGIN: ${PUBLIC_ALLOWED_ORIGIN:-}
      PUBLIC_IP_HASH_PEPPER: ${PUBLIC_IP_HASH_PEPPER:-}
      PUBLIC_SESSION_TTL_HOURS: ${PUBLIC_SESSION_TTL_HOURS:-24}
      PUBLIC_MAX_ACTIVE_SESSIONS: ${PUBLIC_MAX_ACTIVE_SESSIONS:-5000}
      PUBLIC_MAX_ACTIVE_SESSIONS_PER_IP: ${PUBLIC_MAX_ACTIVE_SESSIONS_PER_IP:-10}
      PUBLIC_SESSION_CREATE_PER_IP_PER_DAY: ${PUBLIC_SESSION_CREATE_PER_IP_PER_DAY:-20}
      PUBLIC_SESSION_CHALLENGE_ENABLED: ${PUBLIC_SESSION_CHALLENGE_ENABLED:-true}
      PUBLIC_SESSION_CHALLENGE_THRESHOLD: ${PUBLIC_SESSION_CHALLENGE_THRESHOLD:-3}
      PUBLIC_MAX_DATASETS: ${PUBLIC_MAX_DATASETS:-5}
      PUBLIC_MAX_FILE_SIZE_MB: ${PUBLIC_MAX_FILE_SIZE_MB:-20}
      PUBLIC_MAX_TOTAL_STORAGE_MB: ${PUBLIC_MAX_TOTAL_STORAGE_MB:-100}
      PUBLIC_MAX_ROWS: ${PUBLIC_MAX_ROWS:-100000}
      PUBLIC_MAX_COLUMNS: ${PUBLIC_MAX_COLUMNS:-200}
      PUBLIC_MAX_CLEAN_TASKS: ${PUBLIC_MAX_CLEAN_TASKS:-50}
      PUBLIC_MAX_CHARTS: ${PUBLIC_MAX_CHARTS:-100}
      PUBLIC_MAX_EXPORTS: ${PUBLIC_MAX_EXPORTS:-20}
      PUBLIC_EXPORT_MAX_ROWS: ${PUBLIC_EXPORT_MAX_ROWS:-10000}
      PUBLIC_AI_ENABLED: ${PUBLIC_AI_ENABLED:-false}
      PUBLIC_AI_MAX_CALLS_PER_DAY: ${PUBLIC_AI_MAX_CALLS_PER_DAY:-20}
      PUBLIC_AI_MAX_CALLS_PER_IP_PER_DAY: ${PUBLIC_AI_MAX_CALLS_PER_IP_PER_DAY:-60}
      PUBLIC_AI_GLOBAL_DAILY_CALLS: ${PUBLIC_AI_GLOBAL_DAILY_CALLS:-500}
      PUBLIC_AI_GLOBAL_DAILY_TOKEN_BUDGET: ${PUBLIC_AI_GLOBAL_DAILY_TOKEN_BUDGET:-200000}
      PUBLIC_AI_MAX_INPUT_CHARS: ${PUBLIC_AI_MAX_INPUT_CHARS:-4000}
      PUBLIC_AI_MAX_OUTPUT_TOKENS: ${PUBLIC_AI_MAX_OUTPUT_TOKENS:-1024}
      PUBLIC_AI_MAX_CONCURRENCY: ${PUBLIC_AI_MAX_CONCURRENCY:-1}
      PUBLIC_AI_TIMEOUT_MS: ${PUBLIC_AI_TIMEOUT_MS:-30000}
      PUBLIC_AI_BREAKER_ENABLED: ${PUBLIC_AI_BREAKER_ENABLED:-true}
      PUBLIC_AI_CHALLENGE_ENABLED: ${PUBLIC_AI_CHALLENGE_ENABLED:-true}
      PUBLIC_AI_CHALLENGE_DIFFICULTY: ${PUBLIC_AI_CHALLENGE_DIFFICULTY:-18}
      PUBLIC_AI_CHALLENGE_TTL_SECONDS: ${PUBLIC_AI_CHALLENGE_TTL_SECONDS:-120}
      PUBLIC_DEMO_DATA_ENABLED: ${PUBLIC_DEMO_DATA_ENABLED:-true}
      PUBLIC_CLEANUP_ENABLED: ${PUBLIC_CLEANUP_ENABLED:-true}
      PUBLIC_CLEANUP_INTERVAL_MINUTES: ${PUBLIC_CLEANUP_INTERVAL_MINUTES:-60}
      PUBLIC_CLEANUP_GRACE_MINUTES: ${PUBLIC_CLEANUP_GRACE_MINUTES:-60}
      SERVER_PORT: "8080"
      # 运行指标仅监听内部网络（不映射宿主机端口，Nginx 边缘 404）
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
      MONITORING_INTERVAL_SECONDS: ${MONITORING_INTERVAL_SECONDS:-60}
      UPLOAD_VOLUME_CAPACITY_MB: ${UPLOAD_VOLUME_CAPACITY_MB:-1024}
      ALERT_SESSION_CAPACITY_RATIO: ${ALERT_SESSION_CAPACITY_RATIO:-0.8}
      ALERT_UPLOAD_VOLUME_RATIO: ${ALERT_UPLOAD_VOLUME_RATIO:-0.85}
      ALERT_DB_POOL_RATIO: ${ALERT_DB_POOL_RATIO:-0.9}
      ALERT_AI_BUDGET_RATIO: ${ALERT_AI_BUDGET_RATIO:-0.9}
      ALERT_CLEANUP_FAILURES: ${ALERT_CLEANUP_FAILURES:-3}
      ALERT_ORPHAN_TABLES: ${ALERT_ORPHAN_TABLES:-10}
      ALERT_SCAN_FAILURES_PER_INTERVAL: ${ALERT_SCAN_FAILURES_PER_INTERVAL:-3}
      LOG_PATH: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-50MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-14}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-1GB}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - db_net
      - app_net
    # 不发布宿主机端口；仅通过 nginx 访问；8081 为内网指标端口
    expose:
      - "8080"
      - "8081"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/api/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: dataclean-web:1
    restart: unless-stopped
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-25m}
      NGINX_TEMPLATE: /etc/nginx/default.conf.template
      # HTTPS 叠加时使用真实域名；HTTP 基线模板不使用该变量
      NGINX_SERVER_NAME: ${PUBLIC_SERVER_NAME:-_}
    ports:
      # 唯一对外入口；HTTPS 443 为后续阶段，证书就绪后再增加映射
      - "${HTTP_PORT:-80}:80"
    volumes:
      # 覆盖模板便于 HTTPS 叠加（默认使用镜像内 HTTP 模板）
      - ./deploy/nginx/default.conf.template:/etc/nginx/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/nginx-health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # 对外边缘网络：仅 nginx 与 backend
  # 固定子网，使 TRUSTED_PROXY_CIDRS 可精确指向 Nginx 所在网段；
  # 如与宿主机/云 VPC 网段冲突，需同时调整 ipam 与 TRUSTED_PROXY_CIDRS。
  app_net:
    name: dataclean_app_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # 数据网络：mysql/backend/migrate，禁止访问外网，且不发布端口
  db_net:
    name: dataclean_db_net
    driver: bridge
    internal: true

volumes:
  mysql_data:
    name: dataclean_mysql_data
  backend_uploads:
    name: dataclean_uploads
  backend_logs:
    name: dataclean_logs
